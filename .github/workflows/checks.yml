name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check shared files and Python syntax
        run: python scripts/check_repository.py

# Training needs the stage-specific environments, private local datasets, and
# working CUDA extensions; this workflow does not claim to reproduce experiments.
