[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dasna"
version = "0.1.0"
description = "Diffusion Augmentation with Selective Neighborhood Aggregation for Graph Anomaly Detection"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["dasna*"]

[tool.setuptools]
include-package-data = false
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
